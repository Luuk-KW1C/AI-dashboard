<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlab Scenario's</title>
  <link rel="stylesheet" href="https://use.typekit.net/jhu2kwt.css" />
  <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../CSS/scenarios.css" />
  <link rel="stylesheet" href="../CSS/index.css" />
  <script src="../javascript/scenarios.js" defer></script>
</head>

<body>
  <div class="charlab">
    <img src="../images/charlab-scenarios-logo2.svg" alt="CharLab logo" class="image" />

    <nav class="navbar">
      <ul>
        <li>
          <a href="../HTML/index.html">
            <img src="../images/white-cubes.svg" alt="Dashboard icon" />
            Dashboard
          </a>
        </li>
        <li class="active">
          <a href="../HTML/scenario's.html">
            <img src="../images/small-green-list.svg" alt="Scenario's icon" />
            <strong>Scenario's</strong>
          </a>
        </li>
        <li>
          <a href="../HTML/characters.html">
            <img src="../images/profile.svg" alt="Characters icon" />
            Characters
          </a>
        </li>
        <li>
          <a href="../HTML/dialogue.html">
            <img src="../images/mini-message.svg" alt="Dialogue icon" />
            Dialogue
          </a>
        </li>
        <li>
          <a href="../HTML/environment.html">
            <img src="../images/mini-map.svg" alt="Environment icon" />
            Environments
          </a>
        </li>
      </ul>

      <ul class="bottom">
        <li>
          <a href="../HTML/settings.html">
            <img src="../images/settings.svg" alt="Settings icon" />
            Settings
          </a>
        </li>
        <li class="logout">
          <a href="../HTML/login.html">
            <img src="../images/log-in.svg" alt="Logout icon" />
            Log out
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <main class="scenario">
    <div class="scenarios-header">
      <h1>
        <img src="../images/scenarios.svg" alt="Scenario's icon" />
        <strong>Scenario's</strong>
      </h1>
      <button class="add-button" aria-label="Add new scenario">+</button>
    </div>

    <div class="table">
      <div class="table-header">
        <div>ACTIVE</div>
        <div>NAME</div>
        <div>REFERENCE ID</div>
        <div>TIMES PLAYED</div>
        <div>OPTIONS</div>
      </div>

    </div>
  </main>
</body>
</html>
