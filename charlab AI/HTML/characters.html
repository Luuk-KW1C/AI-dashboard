<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlab Characters</title>
  <link rel="stylesheet" href="https://use.typekit.net/jhu2kwt.css" />
  <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../CSS/characters.css" />
  <link rel="stylesheet" href="../CSS/index.css" />
  <script src="../javascript/characters.js" defer></script>
</head>
<body>
  <div class="charlab">
    <img src="../images/charlab-characters-logo2.svg" alt="CharLab logo" class="image" />
    <nav class="navbar">
      <ul>
        <li>
          <a href="../HTML/index.html">
            <img src="../images/white-cubes.svg" alt="Dashboard" />
            Dashboard
          </a>
        </li>
        <li>
          <a href="../HTML/scenarios.html">
            <img src="../images/paper.svg" alt="Scenarios" />
            Scenario's
          </a>
        </li>
        <li class="active">
          <a href="../HTML/characters.html">
            <img src="../images/small-character-folder.svg" alt="Characters" />
            <strong>Characters</strong>
          </a>
        </li>
        <li>
          <a href="../HTML/dialogue.html">
            <img src="../images/mini-message.svg" alt="Dialogue" />
            Dialogue
          </a>
        </li>
        <li>
          <a href="../HTML/environment.html">
            <img src="../images/mini-map.svg" alt="Environment" />
            Environments
          </a>
        </li>
      </ul>

      <ul class="bottom">
        <li>
          <a href="../HTML/settings.html">
            <img src="../images/settings.svg" alt="Settings" />
            Settings
          </a>
        </li>
        <li class="logout">
          <a href="../HTML/login.html">
            <img src="../images/log-in.svg" alt="Login" />
            Log out
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <main class="character">
    <div class="character-header">
      <h1>
        <img src="../images/characters.svg" alt="characters icon" />
        <strong>Characters</strong>
      </h1>
      <button class="add-button">+</button>
    </div>

    <div class="character-list">
      <div class="character-table">
        <h2>NAME</h2>
        <h2>REFERENCE ID</h2>
        <h2>VOICE</h2>
        <h2>OPTIONS</h2>
      </div>

    </div>
  </main>
</body>
</html>
